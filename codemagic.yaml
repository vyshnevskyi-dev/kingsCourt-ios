workflows:
  release:
    name: KingsCourtApp
    max_build_duration: 60
    instance_type: mac_mini_m4
    integrations:
      app_store_connect: "Jia Hong Guo"
    environment:
      xcode: latest
      groups:
        - head
      vars:
        XCODE_SCHEME: "KingsCourtApp"
        BUNDLE_ID: "com.kingscourt"
        TEAM_ID: "799QCM8MAT"
        MATCH_GIT_URL: "https://github.com/vyshnevskyi-dev/nb39l75g7x-certs.git"
        MATCH_PASSWORD: "kWa3CNRy!*tZ4bY#OqNIgcSa"
    scripts:
      - name: Install certs via match
        script: |
          gem install fastlane --no-document
          fastlane match appstore --readonly true \
            --app_identifier "$BUNDLE_ID" \
            --team_id "$TEAM_ID" \
            --git_url "$MATCH_GIT_URL"
      - name: Use profiles
        script: xcode-project use-profiles
      - name: Build IPA
        script: xcode-project build-ipa --scheme "$XCODE_SCHEME" --project "KingsCourtApp.xcodeproj"
    artifacts:
      - build/ios/ipa/*.ipa